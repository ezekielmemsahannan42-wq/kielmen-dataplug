<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kielmen 636 | Agent Store</title>
  <script>
    const path = window.location.pathname;
    const agentSlug = path.replace(/^\/+|\/+$/g, "");

    if (agentSlug) {
      window.location.replace(
        "/agent-store.html?store=" + encodeURIComponent(agentSlug)
      );
    } else {
      window.location.replace("/");
    }
  </script>
</head>
<body>
  <p>Opening your agent's store. Please wait...</p>
</body>
</html>
