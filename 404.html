<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030712">
  <meta name="robots" content="noindex, nofollow">
  <title>Opening Agent Store | Kielmen 636 Dataplug</title>
</head>
<body style="margin:0;padding:30px;background:#030712;color:white;font-family:Arial,sans-serif;text-align:center">
  <h2>Opening Agent Store...</h2>
  <p id="message">Please wait.</p>  <script>
    (function () {
      const originalPath = window.location.pathname;
      const params = new URLSearchParams(window.location.search);

      let path;

      try {
        path = decodeURIComponent(originalPath)
          .replace(/^\/+|\/+$/g, "");
      } catch (error) {
        document.getElementById("message").textContent =
          "This store link is invalid.";
        return;
      }

      // Support /agents/kofi and /kofi.
      if (path.startsWith("agents/")) {
        path = path.slice("agents/".length);
      }

      // Do not redirect normal website pages.
      const reserved = new Set([
        "index.html",
        "agent-store.html",
        "404.html",
        "success.html",
        "agent-login.html",
        "agent-register.html",
        "agent-dashboard.html",
        "agent-profile.html",
        "agent-withdrawal.html",
        "agent-forgot-password.html",
        "owner-dashboard.html"
      ]);

      if (
        !path ||
        path.includes("/") ||
        path.includes("\\") ||
        !/^[a-zA-Z0-9_-]+$/.test(path) ||
        reserved.has(path.toLowerCase())
      ) {
        document.getElementById("message").textContent =
          "This page could not be found.";
        return;
      }

      params.set("store", path);

      // Assumes kielmen.com serves the website from its root.
      window.location.replace(
        "/agent-store.html?" +
        params.toString() +
        window.location.hash
      );
    })();
  </script></body>
</html>
