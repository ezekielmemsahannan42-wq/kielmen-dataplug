<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening Agent Store | Kielmen 636 Dataplug</title>
</head>
<body>
  <p id="message">Opening agent store. Please wait...</p>  <script>
    (async function () {
      const message = document.getElementById("message");

      let slug;

      try {
        slug = decodeURIComponent(window.location.pathname)
          .replace(/^\/+|\/+$/g, "");
      } catch (error) {
        message.textContent = "Invalid store link.";
        return;
      }

      // Support links such as /agents/one-time-data.
      if (slug.startsWith("agents/")) {
        slug = slug.slice("agents/".length);
      }

      const reservedPages = new Set([
        "index.html",
        "agent-store.html",
        "404.html",
        "success.html",
        "agent-login.html",
        "agent-register.html",
        "agent-dashboard.html",
        "agent-profile.html",
        "agent-withdrawal.html",
        "agent-forgot-password.html",
        "owner-dashboard.html"
      ]);

      if (
        !slug ||
        slug.includes("/") ||
        slug.includes("\\") ||
        !/^[a-zA-Z0-9_-]{1,100}$/.test(slug) ||
        reservedPages.has(slug.toLowerCase())
      ) {
        message.textContent =
          "This page was not found. Please check the agent store link.";
        return;
      }

      try {
        const response = await fetch("/agent-store.html", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            "Could not load agent-store.html. HTTP " + response.status
          );
        }

        let html = await response.text();

        // Set the store slug before the storefront's own scripts run.
        const slugScript =
          "<script>window.__KIELMEN_STORE_SLUG__=" +
          JSON.stringify(slug.toLowerCase()) +
          ";<\/script>";

        const headPattern = /<head(?:\s[^>]*)?>/i;

        if (!headPattern.test(html)) {
          throw new Error("The storefront HTML has no head element.");
        }

        html = html.replace(
          headPattern,
          function (headTag) {
            return headTag + slugScript;
          }
        );

        // Load the storefront while retaining the clean URL.
        document.open();
        document.write(html);
        document.close();

      } catch (error) {
        console.error("Agent store routing error:", error);

        message.textContent =
          "The agent store could not be opened. Please refresh and try again.";
      }
    })();
  </script></body>
</html>
