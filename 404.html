<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030712">
  <title>Opening Agent Store | Kielmen 636 Dataplug</title>
</head>
<body style="margin:0;padding:30px;background:#030712;color:white;font-family:Arial,sans-serif;text-align:center">
  <h2>Opening Agent Store...</h2>
  <p id="message">Please wait.</p>  <script>
    (async function () {
      const originalPath = window.location.pathname;
      const message = document.getElementById("message");

      let slug;

      try {
        slug = decodeURIComponent(originalPath).replace(/^\/+|\/+$/g, "");
      } catch (error) {
        message.textContent = "This store link is invalid.";
        return;
      }

      // Support both /agents/store-name and /store-name.
      if (slug.startsWith("agents/")) {
        slug = slug.slice("agents/".length);
      }

      const reserved = new Set([
        "index.html",
        "agent-store.html",
        "404.html",
        "success.html",
        "agent-login.html",
        "agent-register.html",
        "agent-dashboard.html",
        "agent-profile.html",
        "agent-withdrawal.html",
        "agent-forgot-password.html",
        "owner-dashboard.html"
      ]);

      if (
        !slug ||
        slug.includes("/") ||
        slug.includes("\\") ||
        !/^[a-zA-Z0-9_-]+$/.test(slug) ||
        reserved.has(slug.toLowerCase())
      ) {
        message.textContent = "This page could not be found.";
        return;
      }

      try {
        const response = await fetch("/agent-store.html", {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error("Could not load the storefront.");
        }

        const html = await response.text();

        // Keep the requested clean URL visible.
        const cleanURL =
          originalPath + window.location.search + window.location.hash;

        history.replaceState(null, "", cleanURL);

        // Load the existing storefront document.
        document.open();
        document.write(html);
        document.close();

        // The storefront must read the slug from the path.
      } catch (error) {
        message.textContent =
          "We couldn't open this store. Please check the link and try again.";
      }
    })();
  </script></body>
</html>
