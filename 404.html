<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening Agent Store | Kielmen 636 Dataplug</title>
</head>
<body>
  <p id="message">Opening agent store. Please wait...</p>

  <script>
    (async function () {
      const originalPath = window.location.pathname;

      let path;

      try {
        path = decodeURIComponent(originalPath)
          .replace(/^\/+|\/+$/g, "");
      } catch {
        path = originalPath.replace(/^\/+|\/+$/g, "");
      }

      if (path.startsWith("agents/")) {
        path = path.slice("agents/".length);
      }

      const reserved = new Set([
        "",
        "index.html",
        "agent-store.html",
        "404.html",
        "success.html",
        "agent-login.html",
        "agent-register.html",
        "agent-dashboard.html",
        "agent-profile.html",
        "agent-withdrawal.html",
        "agent-forgot-password.html",
        "owner-dashboard.html"
      ]);

      if (
        !path ||
        path.includes("/") ||
        path.includes("\\") ||
        !/^[a-zA-Z0-9_-]+$/.test(path) ||
        reserved.has(path.toLowerCase())
      ) {
        document.getElementById("message").textContent =
          "This page was not found. Please check the agent store link.";
        return;
      }

      try {
        const response = await fetch("/agent-store.html", {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error("Could not load agent-store.html");
        }

        let html = await response.text();

        const slugScript =
          "<script>window.__KIELMEN_STORE_SLUG__=" +
          JSON.stringify(path.toLowerCase()) +
          ";<" + "/script>";

        if (/<head(?:\s[^>]*)?>/i.test(html)) {
          html = html.replace(
            /<head(?:\s[^>]*)?>/i,
            match => match + slugScript
          );
        } else {
          throw new Error("The storefront HTML has no head element.");
        }

        document.open();
        document.write(html);
        document.close();

      } catch (error) {
        console.error("Agent store routing error:", error);

        document.getElementById("message").textContent =
          "The agent store could not be opened. Please refresh and try again.";
      }
    })();
  </script>
</body>
</html>
