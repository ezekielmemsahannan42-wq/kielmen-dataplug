<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030712">
  <meta name="robots" content="noindex, nofollow">
  <title>Opening Agent Store | Kielmen 636 Dataplug</title>
</head>
<body style="margin:0;padding:30px;background:#030712;color:white;font-family:Arial,sans-serif;text-align:center">
  <h2>Opening Agent Store...</h2>
  <p id="message">Please wait while we load the store.</p>  <script>
    (async function () {
      const message = document.getElementById("message");
      const originalPath = window.location.pathname;

      let slug;

      try {
        slug = decodeURIComponent(originalPath)
          .replace(/^\/+|\/+$/g, "");

        if (slug.startsWith("agents/")) {
          slug = slug.slice("agents/".length);
        }
      } catch (error) {
        message.textContent = "This store link is invalid.";
        return;
      }

      const reserved = new Set([
        "",
        "index.html",
        "agent-store.html",
        "404.html",
        "success.html",
        "agent-login.html",
        "agent-register.html",
        "agent-dashboard.html",
        "agent-profile.html",
        "agent-withdrawal.html",
        "agent-forgot-password.html",
        "owner-dashboard.html"
      ]);

      if (
        !slug ||
        slug.includes("/") ||
        slug.includes("\\") ||
        !/^[a-zA-Z0-9_-]+$/.test(slug) ||
        reserved.has(slug.toLowerCase())
      ) {
        message.textContent = "This page could not be found.";
        return;
      }

      try {
        const response = await fetch("/agent-store.html", {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error("Unable to load the agent store.");
        }

        let html = await response.text();

        /*
         * Preserve the requested slug and make it available to
         * the storefront before its existing JavaScript executes.
         */
        const routingScript = `
          <script>
            (function () {
              const params = new URLSearchParams(location.search);
              if (!params.get("store") && !params.get("slug") &&
                  !params.get("code") && !params.get("agentCode")) {
                params.set("store", ${JSON.stringify(slug)});
                history.replaceState(
                  null,
                  "",
                  location.pathname + "?" + params.toString() + location.hash
                );
              }
            })();
          <\/script>
        `;

        html = html.replace(
          /<head([^>]*)>/i,
          match => match + routingScript
        );

        document.open();
        document.write(html);
        document.close();

      } catch (error) {
        console.error(error);
        message.textContent =
          "We couldn't open this store. Please refresh and try again.";
      }
    })();
  </script></body>
</html>
