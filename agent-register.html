<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Registration | Kielmen 636</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #064e3b;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: #047857;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #047857;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>KIELMEN 636</h1>
        <p>Become a Data Plug Agent</p>

        <form id="agent-form">

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname"
                   placeholder="Enter your full name" required>

            <label for="business">Business Name</label>
            <input type="text" id="business"
                   placeholder="Enter your business name" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter your phone number" required>

            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label for="password">Create Password</label>
            <input type="password" id="password"
                   placeholder="At least 8 characters"
                   minlength="8" required>

            <button type="submit">Create Agent Account</button>

        </form>

        <p id="message"></p>

        <a class="back" href="index.html">Back to Homepage</a>
    </div>

    <script>
document.getElementById("agent-form").addEventListener("submit", async function(event) {
    event.preventDefault();

    const form = event.target;
    const message = document.getElementById("message");
    const button = form.querySelector('button[type="submit"]');

    button.disabled = true;
    button.textContent = "Creating Account...";
    message.style.color = "#ffffff";
    message.textContent = "Please wait while your account is being created.";

    try {
        const fullName =
    document.getElementById("fullname").value.trim();

const businessName =
    document.getElementById("business").value.trim();

const phone =
    document.getElementById("phone").value.trim();

const email =
    document.getElementById("email").value.trim();

const password =
    document.getElementById("password").value;

const storeDescription = "";

        const fullName = form.querySelector(
    'input[placeholder="Full Name"], input[name="fullName"], input[name="full_name"], input[name="name"]'
)?.value?.trim();

const businessName = form.querySelector(
    'input[placeholder="Business Name"], input[name="businessName"], input[name="business_name"]'
)?.value?.trim();

const phone = form.querySelector(
    'input[type="tel"], input[name="phone"]'
)?.value?.trim();

const email = form.querySelector(
    'input[type="email"], input[name="email"]'
)?.value?.trim();

const password = form.querySelector(
    'input[type="password"]'
)?.value;

const storeDescription =
    form.querySelector(
        'textarea[name="storeDescription"]'
    )?.value?.trim() || "";

        if (!fullName || !businessName || !email || !phone || !password) {
            throw new Error(
                "Please complete all required fields."
            );
        }

        const response = await fetch(
            "https://kielmen-dataplug-payment-api.onrender.com/agents/register",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    fullName: String(fullName).trim(),
                    businessName: String(businessName).trim(),
                    email: String(email).trim(),
                    phone: String(phone).trim(),
                    password: String(password),
                    storeDescription: String(storeDescription).trim()
                })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.message ||
                "Registration failed. Please try again."
            );
        }

        message.style.color = "#00c853";
        message.textContent =
            "Registration successful! Your Agent Code is " +
            result.agent.agent_code +
            ". Your account is pending owner approval.";

        form.reset();

    } catch (error) {
        message.style.color = "#ff5252";
        message.textContent =
            error.message ||
            "Unable to connect to the server. Please try again.";
    } finally {
        button.disabled = false;
        button.textContent = "Create Agent Account";
    }
});
        </script>

</body>
</html>
