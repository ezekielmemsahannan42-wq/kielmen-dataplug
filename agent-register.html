<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Registration | Kielmen 636</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #064e3b;
        }

        p {
            text-align: center;
            color: #555;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: #047857;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #047857;
        }

        #message {
            overflow-wrap: anywhere;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>KIELMEN 636</h1>
        <p>Become a Data Plug Agent</p>

        <form id="agent-form">
            <label for="fullname">Full Name</label>
            <input
                type="text"
                id="fullname"
                placeholder="Enter your full name"
                required
                minlength="2"
                maxlength="100"
            >

            <label for="business">Business Name</label>
            <input
                type="text"
                id="business"
                placeholder="Enter your business name"
                required
                minlength="2"
                maxlength="100"
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="e.g. 0241234567"
                required
                autocomplete="tel"
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
                maxlength="255"
                autocomplete="email"
            >

            <label for="password">Create Password</label>
            <input
                type="password"
                id="password"
                placeholder="At least 12 characters"
                required
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
            >

            <button type="submit">Create Agent Account</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a class="back" href="index.html">Back to Homepage</a>
        <p>Already registered? <a href="agent-login.html">Log in here</a></p>
    </div>

    <script>
        const form = document.getElementById("agent-form");
        const message = document.getElementById("message");
        const button = form.querySelector('button[type="submit"]');

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            button.disabled = true;
            button.textContent = "Creating Account...";
            message.style.color = "#555";
            message.textContent = "Please wait while your account is being created.";

            const fullName = document.getElementById("fullname").value.trim();
            const businessName = document.getElementById("business").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;

            try {
                const response = await fetch(
                    "https://kielmen-dataplug-payment-api.onrender.com/agents/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            fullName: fullName,
                            businessName: businessName,
                            phone: phone,
                            email: email,
                            password: password,
                            storeDescription: ""
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.message || "Registration failed. Please try again."
                    );
                }

                message.style.color = "#047857";
                message.textContent =
                    "Registration successful! Your Agent Code is " +
                    result.agent.agent_code +
                    ". Your account is awaiting owner approval. You can log in after your account is approved.";

                form.reset();

            } catch (error) {
                message.style.color = "#dc2626";
                message.textContent =
                    error.message ||
                    "Unable to connect to the server. Please try again.";
            } finally {
                button.disabled = false;
                button.textContent = "Create Agent Account";
            }
        });
    </script>
</body>
</html>
