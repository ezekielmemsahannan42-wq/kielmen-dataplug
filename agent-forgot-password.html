<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">  <title>Forgot Password | Kielmen 636 Dataplug</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #050505;
      color: #f4f5f6;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 28px 22px;
      background: #0b0c0d;
      border: 1px solid #383c3e;
      border-radius: 20px;
      box-shadow: 0 15px 40px #00000040;
    }

    .logo {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 17px;
      background: #020617;
      color: #42cda5;
      font-size: 23px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 27px;
    }

    .description {
      color: #9299a1;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 14px;
      border: 1px solid #45494c;
      border-radius: 11px;
      background: #111213;
      color: #f4f5f6;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #42cda5;
      box-shadow: 0 0 0 2px #42cda525;
    }

    button {
      width: 100%;
      min-height: 51px;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 11px;
      background: #008a49;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 17px;
      padding: 13px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #message.show {
      display: block;
    }

    #message.error {
      color: #ffc0c0;
      background: #421818;
      border: 1px solid #773131;
    }

    #message.success {
      color: #a8ffd4;
      background: #0c3020;
      border: 1px solid #176b43;
    }

    .links {
      margin-top: 24px;
      text-align: center;
      line-height: 2.2;
      font-size: 14px;
    }

    a {
      color: #42cda5;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 22px;
      color: #9299a1;
      text-align: center;
      font-size: 12px;
    }
  </style></head><body>
  <main class="card"><div class="logo">K636</div>

<h1>🔐 Forgot Password?</h1>

<p class="description">
  Forgot your agent account password?
  Enter the email address registered to your
  Kielmen 636 Dataplug account to request a password-reset link.
</p>

<form id="forgotForm">
  <label for="email">Registered Email Address</label>

  <input
    id="email"
    name="email"
    type="email"
    autocomplete="email"
    maxlength="255"
    placeholder="Enter your registered email"
    required
  >

  <button id="submitButton" type="submit">
    Send Reset Link
  </button>
</form>

<div
  id="message"
  role="status"
  aria-live="polite"
></div>

<div class="links">
  <a href="agent-login.html">← Back to Agent Sign In</a>
  <br>
  <a href="index.html">Back to Home</a>
</div>

<p class="footer">
  © Kielmen 636 Dataplug
</p>

  </main>  <script>
    "use strict";

    const API_BASE =
      "https://kielmen-dataplug-payment-api.onrender.com";

    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "show " + type;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        showMessage(
          "Please enter your registered email address.",
          "error"
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Requesting Reset...";
      message.className = "";
      message.textContent = "";

      try {
        const response = await fetch(
          API_BASE + "/agents/forgot-password",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              email: email
            })
          }
        );

        let result;

        try {
          result = await response.json();
        } catch {
          throw new Error(
            "The server returned an invalid response. Please try again."
          );
        }

        if (!response.ok) {
          showMessage(
            result.message ||
            "The password-reset request could not be completed. Please try again later.",
            "error"
          );
          return;
        }

        showMessage(
          result.message ||
          "If an account exists for that email, password-reset instructions will be sent. Please check your inbox and spam folder.",
          "success"
        );

        form.reset();

      } catch (error) {
        console.error("Forgot password error:", error);

        showMessage(
          "The password-reset service is not available yet or the server could not be reached. Please try again later.",
          "error"
        );

      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Send Reset Link";
      }
    });
  </script></body>
</html>
