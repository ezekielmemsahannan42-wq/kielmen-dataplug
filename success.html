<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status | Kielmen 636 Dataplug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f7f6;
            padding: 40px 15px;
        }
        .box {
            background: white;
            max-width: 450px;
            margin: 40px auto;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0001;
        }
        h1 { color: #087f5b; }
        p { line-height: 1.6; }
        a {
            display: inline-block;
            background: #087f5b;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1 id="heading">Checking payment...</h1>
        <p id="message">Please wait while we confirm your payment with Paystack.</p>
        <a href="./">Return to website</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const reference = params.get("reference");

        async function verifyPayment() {
            if (!reference) {
                document.getElementById("heading").textContent = "Payment not confirmed";
                document.getElementById("message").textContent =
                    "No payment reference was found. Please contact support before trying again.";
                return;
            }

            try {
                const response = await fetch(
                    "https://kielmen-dataplug-payment-api.onrender.com/verify-payment",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ reference: reference })
                    }
                );

                const result = await response.json();

                if (response.ok && result.success === true) {
                    document.getElementById("heading").textContent = "Payment verified";
                    document.getElementById("message").textContent =
                        "Paystack has confirmed your payment. Data delivery has not yet been confirmed.";
                } else {
                    document.getElementById("heading").textContent = "Payment not confirmed";
                    document.getElementById("message").textContent =
                        result.message || "We could not confirm your payment. Please contact support.";
                }
            } catch (error) {
                document.getElementById("heading").textContent = "Verification delayed";
                document.getElementById("message").textContent =
                    "We could not check your payment right now. Please try again later.";
            }
        }

        verifyPayment();
    </script>
</body>
</html>
